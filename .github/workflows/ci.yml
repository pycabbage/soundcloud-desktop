name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_rust:
    name: Check (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Tauri CLI
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          sh <(curl https://create.tauri.app/sh) -- -y
      - name: Run tests
        working-directory: src-tauri
        run: |
          bun run --filter @soundcloud-desktop/inject build
          cargo test --all-features
      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features
  check_ts:
    name: Check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run typecheck
        run: bun run --filter @soundcloud-desktop/inject typecheck
      - name: Run lint
        run: bun run --filter @soundcloud-desktop/inject lint
      - name: Run build
        run: bun run --filter @soundcloud-desktop/inject build
