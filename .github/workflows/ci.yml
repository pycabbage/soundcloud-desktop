name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_rust:
    name: Check (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Tauri CLI
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          sh <(curl https://create.tauri.app/sh) -- -y
      - name: Run tests
        working-directory: src-tauri
        run: |
          bun run --filter @soundcloud-desktop/inject build
          cargo test --all-features
      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features
  check_ts:
    name: Check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run typecheck
        run: bun run --filter @soundcloud-desktop/inject typecheck
      - name: Run lint
        run: bun run --filter @soundcloud-desktop/inject lint
      - name: Run build
        run: bun run --filter @soundcloud-desktop/inject build
  release:
    name: Release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    needs: [check_rust, check_ts]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # NODE_ENV must also reach `beforeBuildCommand`, which rebuilds the bundle
      # inside tauri-action; without it the shipped bundle is a dev build.
      - name: Prepare JS bundle
        env:
          NODE_ENV: production
        run: bun run --filter @soundcloud-desktop/inject build
      - uses: tauri-apps/tauri-action@v1
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'SoundCloud desktop v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          prerelease: ${{ contains(github.ref, '-beta') }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      # After the build, so the uploaded map matches the shipped bundle.
      - name: Upload source maps to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: cabbagelettuce
          SENTRY_PROJECT: soundcloud-desktop
          TAG: ${{ github.ref_name }}
        run: |
          release="soundcloud-desktop@${TAG#v}"
          bunx @sentry/cli@3 releases new "$release"
          bunx @sentry/cli@3 sourcemaps upload \
            --release "$release" \
            --url-prefix '~/inject' \
            packages/inject/dist
          bunx @sentry/cli@3 releases finalize "$release"
